<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Codex Glass · 设计与交互审阅</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#29313c;font-family:system-ui,'Microsoft YaHei',sans-serif}main{max-width:960px;margin:70px auto;padding:24px}h1{font-size:28px;font-weight:600;letter-spacing:-1px}p{color:#75808c;font-size:13px}.scene{margin-top:28px;border-radius:32px;padding:70px;min-height:400px;background:radial-gradient(ellipse at 80% 20%,#bfd0eb,transparent 60%),radial-gradient(ellipse at 10% 70%,#c6dcd1,transparent 65%),#e4e9ee;display:flex;align-items:flex-start;justify-content:space-around;gap:36px}.glass{--alpha:.86;background:rgb(255 255 255 / var(--alpha));backdrop-filter:blur(32px);border:1px solid #ffffffd9;box-shadow:0 10px 26px #243b4517,inset 0 1px 1px #fff9}.card{width:280px;padding:15px 18px 14px;border-radius:28px;flex-shrink:0}.head{display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:600}button{border:0;border-radius:10px;background:#ffffff30;color:#74808c;cursor:pointer;transition:background .12s,transform .18s;width:26px;height:26px;padding:0;font-size:15px}button:hover{background:#ffffffb0}button:active{transform:scale(.96);background:#fff}.metric{margin-top:10px}.value{display:flex;align-items:center;justify-content:space-between;color:#75808c;font-size:12px}.value strong{font-size:27px;color:#29313c;font-weight:500}.reset{font-size:10px;color:#87929e;margin:4px 0 5px}.track{height:4px;border-radius:9px;background:#26384b12}.fill{height:100%;border-radius:9px;background:linear-gradient(90deg,#54c8b5,#65bce4,#8b94ee,#b792df)}hr{border:0;border-top:1px solid #35475812;margin:12px 0 8px}.footer{display:flex;justify-content:space-between;font-size:9px;color:#83909d;margin-top:10px}.side{position:relative}.compact{width:268px;height:65px;padding:12px 18px;border-radius:34px;display:grid;grid-template-columns:48px 1fr 1fr 26px;align-items:center;gap:16px}.compact b{font-size:12px}.compact small{display:block;font-size:9px;color:#87929e}.compact strong{display:block;font-size:21px;font-weight:500}.panel{position:absolute;top:86px;right:0;width:240px;border-radius:22px;padding:12px 16px 16px;background:#f9fbfcf5;border:1px solid white;box-shadow:0 10px 26px #243b4517;opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity .18s,transform .18s}.panel.open{opacity:1;transform:translateY(0);pointer-events:auto}.panel.closing{transition-duration:.14s}label{font-size:11px;color:#75808c}.percent{font-size:11px;margin:6px 0 10px;color:#75808c}input[type=range]{width:100%;accent-color:#8193a8}input[type=checkbox]{accent-color:#8193a8}.check{margin-top:12px}.note{margin-top:20px}@media(prefers-reduced-motion:reduce){*{transition:none!important}}@media(max-width:700px){.scene{padding:30px;flex-direction:column;min-height:520px}}
</style>
<main><h1>轻盈，恰到好处。</h1><p>本地交互审阅稿 · 与本次代码对应 · Figma 云端暂受套餐额度限制</p><div class="scene">
<section class="card glass"><div class="head">codex <span><button title="刷新" id="refresh">↻</button><button title="收起" id="collapse">−</button><button title="透明度设置" class="more">⋯</button></span></div><div id="details"><div class="metric"><div class="value">5 小时<strong>82%</strong></div><div class="reset">1 小时 59 分钟后重置</div><div class="track"><div class="fill" style="width:82%"></div></div></div><hr><div class="metric"><div class="value">每周<strong>64%</strong></div><div class="reset">2 天 1 小时后重置</div><div class="track"><div class="fill" style="width:64%"></div></div></div><div class="footer"><span>演示数据</span><span>余量充足，放心推进</span></div></div></section>
<div class="side"><section class="compact glass"><b>codex</b><div><small>5 小时</small><strong>82%</strong></div><div><small>每周</small><strong>64%</strong></div><button title="展开" id="expand">⌃</button></section><section class="panel" id="panel"><div class="head">透明度<button id="close" title="关闭">×</button></div><div class="percent" id="percent">14%</div><input id="opacity" aria-label="玻璃背景透明度" type="range" min="5" max="65" value="14"><div class="check"><label><input type="checkbox" checked>仅 Codex 前台显示</label></div></section></div></div><p class="note">点击三个点预览设置；拖动滑杆只改变玻璃背景。文字与渐变额度条保持清晰。这里显示演示数据。</p></main>
<script>
const panel=document.querySelector('#panel'),details=document.querySelector('#details');function close(){panel.classList.add('closing');panel.classList.remove('open')}document.querySelector('.more').onclick=e=>{e.stopPropagation();panel.classList.remove('closing');panel.classList.toggle('open')};document.querySelector('#close').onclick=close;panel.onclick=e=>e.stopPropagation();document.addEventListener('click',close);document.querySelector('#opacity').oninput=e=>{document.querySelector('#percent').textContent=e.target.value+'%';document.querySelectorAll('.glass').forEach(n=>n.style.setProperty('--alpha',1-e.target.value/100))};function toggle(hide){const old=details.getBoundingClientRect().height;details.hidden=hide;const target=hide?0:details.getBoundingClientRect().height;if(!matchMedia('(prefers-reduced-motion: reduce)').matches)details.animate([{height:old+'px',opacity:hide?1:0},{height:target+'px',opacity:hide?0:1}],{duration:220,easing:'cubic-bezier(.22,1,.36,1)'});close()}document.querySelector('#collapse').onclick=e=>{e.stopPropagation();toggle(!details.hidden)};document.querySelector('#expand').onclick=e=>{e.stopPropagation();toggle(false)};document.querySelector('#refresh').onclick=e=>e.currentTarget.animate([{transform:'rotate(0)'},{transform:'rotate(360deg)'}],{duration:450,easing:'ease-out'});
</script></html>
