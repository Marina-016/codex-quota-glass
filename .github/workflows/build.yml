name: Windows build
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        shell: powershell
        run: .\build.ps1 -Test
      - uses: actions/upload-artifact@v4
        with:
          name: CodexQuotaGlass-windows
          path: |
            outputs/CodexQuotaGlass/CodexQuotaGlass.exe
            outputs/CodexQuotaGlass/CodexQuotaGlass.exe.config
